[project]
name = "src"
version = "0.1.0"
dependencies = [
	"pytest==8.4.2",
	"staticfg==0.9.5",
	"mutmut==2.5.1",
]

[tool.mutmut]
paths_to_mutate = [
    "src/energy/EnergyManagementSystem.py",
    "src/flight/FlightBookingSystem.py",
	"src/fraud/FraudDetectionSystem.py",

]

runner = "pytest"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = [".venv", "mutants"]
